<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Made for your firm | Brixen</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Caveat:wght@600&display=swap">
<style>
/* Same look as the estimating page (brixen-landing/deploy): white page, navy ink, blue pill button, Poppins, handwritten note.
   One job: their note → headline → video → one button that opens the booking calendar. */
:root{
  --paper:#ffffff; --band:#f6f8fb; --ink:#152238; --ink-2:#5e6b78; --line:#d3d7de;
  --cta:#1d5bd6; --cta-hover:#1649b3; --on-cta:#ffffff; --cta-soft:#eaf1fd; --check:#1d7a4c;
  --shadow:0 24px 60px -24px rgba(21,34,56,.35);
  --display:"Poppins",system-ui,"Segoe UI",Arial,sans-serif; --body:"Poppins",system-ui,"Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 1rem/1.65 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
:focus-visible{outline:3px solid var(--cta);outline-offset:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{text-decoration:none;display:flex;align-items:center;gap:10px;color:inherit}
.logo{height:48px;width:auto;display:block}
.where{display:block;font:500 .76rem/1.35 var(--body);color:var(--ink-2);padding-left:12px;border-left:1px solid var(--line)}
.call{display:inline-flex;align-items:center;gap:10px;font-weight:600;text-decoration:none;background:var(--ink);color:#fff;border-radius:999px;padding:10px 22px 10px 10px;font-size:1.02rem;white-space:nowrap}
.call:hover{background:#22355a}
.call .ring{width:34px;height:34px;border-radius:50%;background:var(--cta);display:grid;place-items:center}
.call svg{width:17px;height:17px;color:#fff}
.call .num{font-family:var(--mono);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 1rem/1 var(--body);text-decoration:none;border:0;cursor:pointer;border-radius:999px;background:var(--cta);color:var(--on-cta);padding:16px 28px;transition:transform .15s ease,background .15s ease}
.btn:hover{background:var(--cta-hover);transform:translateY(-1px)}
.book{font-size:1.15rem;padding:20px 36px;box-shadow:0 14px 34px -12px rgba(29,91,214,.55)}
.book svg{width:20px;height:20px;flex:none}
.hero{padding-block:36px 56px;text-align:center}
.note-card{display:block;width:fit-content;max-width:620px;margin:0 auto 20px;padding:14px 24px 10px;background:#fff8d6;border-radius:6px;box-shadow:0 10px 24px rgba(21,34,56,.12);rotate:-1.2deg;font-family:"Caveat",cursive;font-size:1.55rem;line-height:1.25;color:#1f2a44;text-align:left}
.note-card .sig{display:block;text-align:right;margin-top:4px}
.hero h1{font-weight:600;font-size:clamp(1.9rem,4vw,3.1rem);line-height:1.16;max-width:980px;margin-inline:auto}
.hero h1 .l2{display:block;color:var(--cta)}
.value-line{max-width:820px;margin:14px auto 0;font-size:1.05rem;line-height:1.6;color:var(--ink-2)}
.value-line b{color:var(--ink)}
.vsl-wrap{max-width:900px;margin:28px auto 0}
.vsl{position:relative;border-radius:16px;overflow:hidden;background:#152238;box-shadow:var(--shadow);aspect-ratio:16/9;border:1px solid var(--line)}
.vsl video,.vsl img{display:block;width:100%;height:100%;object-fit:cover}
.vsl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vsl .tap{position:absolute;inset:0;border:0;background:rgba(21,34,56,.18);cursor:pointer;display:grid;place-items:center}
.play{width:84px;height:84px;border-radius:50%;background:var(--cta);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(29,91,214,.22),0 10px 30px rgba(0,0,0,.35)}
.play svg{width:30px;height:30px;margin-left:5px;color:#fff}
.trust{max-width:1100px;margin:16px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;list-style:none;padding:0}
.trust li{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.84rem;color:var(--ink-2)}
.trust li b{color:var(--ink);font-weight:700}
.trust li.lead{border-color:var(--cta);color:var(--ink)}.trust li.lead b{color:var(--cta)}
.trust svg{width:16px;height:16px;flex:none;color:var(--cta)}
.cta{max-width:680px;margin:34px auto 0;text-align:center}
.cta h2{font-weight:600;font-size:clamp(1.3rem,2.4vw,1.7rem);margin-bottom:8px}
.cta h2 b{color:var(--cta);font-weight:700}
.cta-sub{color:var(--ink-2);max-width:560px;margin:0 auto 18px;line-height:1.55}
.risk{margin-top:14px;font-size:.92rem;color:var(--ink-2)}
.cal{scroll-margin-top:90px;max-width:860px;margin:24px auto 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.cal iframe{display:block;width:100%;border:0;height:700px}
.booked{padding:34px 22px;text-align:center}
.booked .tick{width:60px;height:60px;border-radius:50%;background:#e8f5ee;display:grid;place-items:center;margin:0 auto 14px}
.booked .tick svg{width:30px;height:30px;color:var(--check)}
.booked h3{font-weight:600;font-size:1.5rem;margin-bottom:6px}
.booked p{color:var(--ink-2)}
.booked ul{list-style:none;padding:0;margin:18px auto 0;max-width:520px;text-align:left;display:grid;gap:8px}
.booked li{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.95rem}
.booked li b{color:var(--cta);font-weight:600}
.band{background:var(--band);border-block:1px solid var(--line);padding-block:56px}
.sec-head{max-width:42em;margin:0 auto 24px;text-align:center}
.sec-head h2{font-weight:600;font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.2}
.sec-head p{color:var(--ink-2);margin-top:8px}
.nums{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow);text-align:left}
.bars div{margin:14px 0}.bars label{display:flex;justify-content:space-between;gap:12px;font-weight:500;margin-bottom:6px}
.bars label span{font-weight:700;font-family:var(--mono);white-space:nowrap}
.bars u{display:block;height:18px;background:#e7eaf0;border-radius:999px;overflow:hidden;text-decoration:none}.bars i{display:block;height:100%;background:#9aa4b2;border-radius:999px}.bars .us i{background:var(--cta)}
.save{background:var(--ink);color:#fff;border-radius:12px;padding:18px;margin-top:18px;text-align:center}
.save b{display:block;font:700 clamp(2rem,5vw,2.8rem)/1.05 var(--display);letter-spacing:-.02em}.save span{font-size:.8rem;color:#c5cddb;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.fine{font-size:.86rem;color:var(--ink-2);margin-top:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:980px;margin:0 auto}
.three div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left}
.three b{display:block;font-weight:600;font-size:1.05rem;margin-bottom:4px}.three span{font-size:.95rem;color:var(--ink-2)}
.close{padding-block:56px 72px}
footer{padding-block:24px;font-size:.88rem;color:var(--ink-2);border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:none}
.dock .btn{width:100%;padding:15px}
@media (max-width:640px){
  .hero{padding-block:22px 44px}.call{padding:8px 16px 8px 8px;font-size:.95rem}.call .num{display:none}.logo{height:40px}.where{font-size:.7rem;padding-left:10px}
  .note-card{font-size:1.35rem}.three{grid-template-columns:minmax(0,1fr)}.book{width:100%;padding:18px 20px}.dock{display:block}body{padding-bottom:84px}.band{padding-block:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#top" aria-label="Brixen Consultancy, Austin, Texas"><img src="logo.png" alt="Brixen Consultancy" class="logo"><span class="where">Austin, TX<br>U.S. Head Office</span></a>
  <a class="call" id="call" href="#"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>Call us <span class="num" id="num"></span></a>
</div></header>
<main id="top"></main>
<footer><div class="wrap"><span><b>Brixen Consultancy</b> · U.S. Head Office, 5900 Balcones Drive, STE 100, Austin, TX 78731</span><span>Your files are used for your work only. We never contact your clients.</span></div></footer>
<div class="dock"><button class="btn" type="button" data-book>I'd like to explore my options</button></div>
<script>
// ---------------- settings ----------------
var PHONE = "+1 (737) 977-9817";
var BOOKING_URL = "https://api.leadconnectorhq.com/widget/booking/sF8ukLE9qUKFJSMhXwPK";   // the same GHL calendar the estimating page opens
var BUTTON = "I'd like to explore my options";                                                // the video's ending says these same words

// ---------------- what the link says about this firm ----------------
// c firm · n first name · r role they are hiring · pay yearly pay for that seat · ps "ad" (their own ad) or "med" (going rate)
// q a|b|c|d (their situation) · st state · d date the ad was posted · f who signs · v Google Drive id of their own video · src
var Q = new URLSearchParams(location.search), g = function (k) { return (Q.get(k) || "").trim(); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); };
var m = function (x) { return "$" + Math.round(x).toLocaleString("en-US"); };
var firm = g("c").replace(/\.$/, "") || "your firm", first = g("n").replace(/^.*"(.+)".*$/, "$1").split(" ")[0], role = g("r"), pay = parseFloat(g("pay")) || 0;
var q = (g("q") || (role ? (pay ? "a" : "b") : "d")).toLowerCase(); if (q === "a" && !pay) q = "b";
var sender = g("f") || "Bella", vid = g("v").replace(/[^\w-]/g, "");
var aRole = role ? ((/^([aeiou]|mep |hvac )/i.test(role) ? "an " : "a ") + role) : "a new hire";
var posted = (function () { var t = Date.parse(g("d")); return isFinite(t) ? new Date(t).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }) : ""; })();
// which kind of firm this is, from the job title: it picks the video and the words
var kind = /architect|residential|interior|kitchen|home/i.test(role) ? "arch" : /struct|steel|rebar|detail|tekla/i.test(role) ? "str" : /mep|hvac|mechanical|electrical|plumbing|fire|sprinkler/i.test(role) ? "mep" : "bim";
var K = {
  mep: { check: "Checked twice by engineers", head: "MEP sets out the door 4x faster.", l2: "Without another hire." },
  str: { check: "Checked twice by engineers", head: "structural sheets back 4x faster.", l2: "Your engineers stay on engineering." },
  arch: { check: "Checked twice before you see it", head: "the next project, without the late nights.", l2: "Issued under your own name." },
  bim: { check: "Checked twice by engineers", head: "Revit models 4x faster.", l2: "Without another hire." }
}[kind];
var LEAD = function (t) { return g("c") ? esc(firm) + ": " + t : t.charAt(0).toUpperCase() + t.slice(1); };   // no firm in the link: just start with a capital
var HEAD = LEAD(K.head);
// no firm in the link (the page as shown inside the general video): the headline simply starts with a capital
var named = !!g("c"), P = function (t) { return named ? esc(firm) + ": " + t : t.charAt(0).toUpperCase() + t.slice(1); };
var save = Math.floor(pay * 0.7 / 1000) * 1000, team = pay - save, hello = first ? esc(first) + " — " : "";

var V = {
  a: { note: hello + "I saw " + esc(firm) + (/s$/i.test(firm) ? "’" : "’s") + " ad for " + esc(aRole) + (posted ? ", posted " + posted : "") + ". Before you add another person to payroll, I put together a quick breakdown of what this could look like for " + esc(firm) + ". The video below is for you.", h1: HEAD, l2: K.l2 },
  b: { note: hello + "I saw " + esc(firm) + " is hiring " + esc(aRole) + (posted ? " (posted " + posted + ")" : "") + ". Before you add another person to payroll, I put together a quick breakdown of what this could look like for " + esc(firm) + ". The video below is for you.", h1: HEAD, l2: K.l2 },
  c: { note: hello + "I saw in " + esc(firm) + (/s$/i.test(firm) ? "’" : "’s") + " " + (role ? esc(role) + " " : "") + "ad that you work with an outside drafting team. I put together a quick breakdown of another way to do it. The video below is for you.", h1: LEAD("drawings that come back right."), l2: "The first time." },
  d: { note: hello + (g("c") ? "I put together a quick breakdown of what this could look like for " + esc(firm) + ". The video below is for you." : "Before you add another person to payroll, watch this. It is under two minutes."), h1: HEAD, l2: K.l2 }
}[q] || {};

var tick = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';
var calIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
var bookBtn = '<button class="btn book" type="button" data-book>' + calIcon + BUTTON + '</button>';
var src = kind === "arch" ? "arch" : "eng";
var player = '<div class="vsl" id="vsl"><video controls preload="none" playsinline poster="' + src + '.jpg" src="' + src + '.mp4"></video></div>';

var numbers = q !== "a" ? "" : '<section class="band"><div class="wrap"><div class="sec-head"><h2>The numbers for ' + esc(firm) + '</h2><p>Worked out from ' + (g("ps") === "ad" ? "the pay in your own job ad." : "the going rate for this role in this month’s US job ads. Your ad shows no pay.") + '</p></div>' +
  '<div class="nums"><div class="bars"><div><label>One full-time ' + esc(role) + '<span>' + m(pay) + ' a year</span></label><u><i style="width:100%"></i></u></div>' +
  '<div class="us"><label>A whole Brixen team on the same work<span>from ' + m(team) + ' a year</span></label><u><i style="width:' + Math.max(4, team / pay * 100).toFixed(1) + '%"></i></u></div></div>' +
  '<div class="save"><b>Up to ' + m(save) + '</b><span>saved each year</span></div>' +
  '<p class="fine">The saving is up to 70% of that salary. Payroll tax, benefits, software and a desk for a hire come on top and are not counted here, so the real gap is wider.</p></div></div></section>';

document.title = "Made for " + firm + " | Brixen";
var tel = "tel:" + PHONE.replace(/[^+\d]/g, "");
document.getElementById("call").href = tel; document.getElementById("num").textContent = PHONE;
document.getElementById("top").innerHTML =
  '<section class="hero"><div class="wrap">' +
  '<p class="note-card">' + V.note + '<span class="sig">— ' + esc(sender) + ', Brixen</span></p>' +
  '<h1>' + V.h1 + ' <span class="l2">' + V.l2 + '</span></h1>' +
  '<div class="vsl-wrap">' + player +
  '<ul class="trust" aria-label="Why firms trust Brixen"><li class="lead">' + tick + '<span>Led by managers of <b>$2.7B+</b> in U.S. construction</span></li><li>' + tick + '<span>Done in <b>your templates</b>, under <b>your stamp</b></span></li><li>' + tick + '<span>' + K.check + '</span></li></ul></div>' +
  '<div class="cta"><h2>' + (q === "c" ? "See it next to your current team." : "See what this would look like for <b>" + esc(firm) + "</b>.") + '</h2>' +
  '<p class="cta-sub">Pick a time for a short call. Bring ' + (q === "c" ? "one sheet your current team is drawing" : "the seat you are hiring for, or one live project") + ', and you leave with a price and a date.</p>' + bookBtn +
  '<p class="risk">Price and date before anything starts · NDA first · No contract</p></div>' +
  '<div class="cal" id="cal" hidden></div>' +
  '</div></section>';

// Their own video (made from the sheet) plays from Google Drive, the same way the estimating page does it.
if (vid) {
  var box = document.getElementById("vsl"), phone = window.matchMedia && matchMedia("(max-width: 760px), (pointer: coarse)").matches;
  if (phone) box.innerHTML = '<img alt="Your video" src="https://drive.google.com/thumbnail?id=' + vid + '&sz=w1280"><a class="tap" target="_blank" rel="noopener" href="https://drive.google.com/file/d/' + vid + '/view" aria-label="Play your video"><span class="play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span></a>';
  else box.innerHTML = '<iframe allow="autoplay; fullscreen" allowfullscreen title="Your video" src="https://drive.google.com/file/d/' + vid + '/preview"></iframe>';
}

// The button opens the booking calendar right on the page (loaded only when asked for).
function openCal() {
  var cal = document.getElementById("cal");
  if (!cal.firstChild) {
    var f = document.createElement("iframe");
    f.src = BOOKING_URL + "?utm_source=" + encodeURIComponent("design-" + (g("src") || "page")) + (first ? "&first_name=" + encodeURIComponent(first) : "") + (g("c") ? "&company_name=" + encodeURIComponent(g("c")) : "");
    f.id = "bx_cal_design"; f.title = "Book a short call"; f.setAttribute("scrolling", "no");
    cal.appendChild(f);
    if (!document.getElementById("ghl-embed")) { var sc = document.createElement("script"); sc.id = "ghl-embed"; sc.src = "https://link.msgsndr.com/js/form_embed.js"; document.body.appendChild(sc); }
  }
  cal.hidden = false; cal.scrollIntoView({ behavior: "smooth", block: "start" });
}
document.querySelectorAll("[data-book]").forEach(function (b) { b.addEventListener("click", openCal); });
// Booking done (the calendar's thank-you page tells us): swap the calendar for a short "you're booked" card.
window.addEventListener("message", function (e) {
  if (!e.data || e.data.bx !== "booked") return; var cal = document.getElementById("cal"); if (!cal) return;
  cal.innerHTML = '<div class="booked"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></div><h3>You’re booked.</h3><p>The invite is on its way to your email.</p>' +
    '<ul><li><b>1</b><span>Bring the seat you are hiring for, or one live project.</span></li><li><b>2</b><span>We’ll tell you how we’d handle it, what it costs and when you’d have it.</span></li><li><b>3</b><span>A short call. No pitch, no contract.</span></li></ul></div>';
  cal.hidden = false; cal.scrollIntoView({ behavior: "smooth", block: "start" });
});
</script>
</body>
</html>
