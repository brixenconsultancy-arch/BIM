<style>
:root{--red:#d8352c;--red2:#b8231c;--ink:#131417;--ink2:#2a2d33;--muted:#5d6068;--line:#e1e2e5;--paper:#f3f3f4;--card:#fff;--soft:#fff6f5}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 "Segoe UI",Inter,Helvetica,Arial,sans-serif}
header{background:var(--ink);color:#fff;border-bottom:5px solid var(--red)}
.bar{max-width:720px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:.14em;font-size:13px;text-transform:uppercase;color:#fff;text-decoration:none}.brand b{color:var(--red)}
.bar a.all{color:#c9ccd3;font-size:14px}
main{max-width:720px;margin:0 auto;padding:22px 16px 48px}
.card{background:var(--card);border-radius:12px;padding:28px 26px;box-shadow:0 2px 16px rgba(0,0,0,.07);animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.prog i,.bars i{transition:none}}
.kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red2);font-weight:700;margin:0 0 8px}
h1{font-size:33px;line-height:1.13;margin:0 0 12px;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:24px;line-height:1.25;margin:0 0 14px;text-wrap:balance}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--red2);margin:28px 0 6px}
p{margin:10px 0}.muted{color:var(--muted);font-size:15px}
ul.get{list-style:none;padding:0;margin:16px 0 4px}ul.get li{padding:7px 0 7px 26px;position:relative;border-bottom:1px solid var(--line)}ul.get li:last-child{border:0}
ul.get li:before{content:"";position:absolute;left:2px;top:14px;width:12px;height:6px;border-left:3px solid var(--red);border-bottom:3px solid var(--red);transform:rotate(-45deg)}
.btn{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:8px;padding:14px 24px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--red2)}.btn:focus-visible,.opt:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}.btn.ghost:hover{background:var(--ink);color:#fff}
.prog{height:6px;background:var(--line);border-radius:3px;margin:0 0 20px;overflow:hidden}.prog i{display:block;height:100%;background:var(--red);transition:width .25s}
.step{font-size:13px;color:var(--muted);margin:0 0 6px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:15px 16px;margin:10px 0;font:inherit;cursor:pointer;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--ink);background:#fafafa}
.num{display:flex;align-items:center;gap:10px;margin:14px 0 6px}.num span{font-size:22px;color:var(--muted)}
input{font:inherit;width:100%;border:2px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff;color:var(--ink)}
input:focus{border-color:var(--ink);outline:0}
.num input{font-size:26px;font-weight:700;max-width:250px;font-variant-numeric:tabular-nums}
.nav{display:flex;align-items:center;gap:18px;margin-top:14px;flex-wrap:wrap}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;padding:8px 0;text-decoration:underline}
.big{background:var(--ink);color:#fff;border-radius:12px;padding:24px 20px;margin:4px 0 16px;display:flex;align-items:center;justify-content:center;gap:22px;text-align:left}
.big b{display:block;font-size:54px;line-height:1.02;font-variant-numeric:tabular-nums}.big span{font-size:13px;color:#c9ccd3;text-transform:uppercase;letter-spacing:.08em}
.ring{flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-items:center}.ring i{width:66px;height:66px;border-radius:50%;background:var(--ink)}
.say{border-left:6px solid var(--red);background:var(--soft);padding:14px 16px;margin:14px 0;font-size:18px;line-height:1.45;border-radius:0 8px 8px 0}.say b{color:var(--red2)}
.bars{margin:18px 0 6px}.bars div{margin:10px 0}.bars label{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin:0 0 4px;color:var(--ink)}
.bars label span{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bars u{display:block;height:14px;background:var(--line);border-radius:4px;overflow:hidden;text-decoration:none}.bars i{display:block;height:100%;background:#8d9099;border-radius:4px;transition:width .5s ease-out}.bars .hi i{background:var(--red)}
.lock{border:2px dashed #c9ccd3;border-radius:12px;padding:18px;margin:20px 0 6px}
.lock ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}.lock li{margin:4px 0}
form{display:grid;gap:10px;margin-top:14px}form label{font-size:14px;color:var(--muted);display:block;margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red2);font-size:14px;min-height:20px;margin:0}
.row{border-bottom:1px solid var(--line);padding:14px 0}.row:last-child{border:0}
.row .t{display:flex;justify-content:space-between;gap:12px;font-weight:700}.row .t span{font-variant-numeric:tabular-nums;white-space:nowrap}
.row p{margin:6px 0 0;font-size:16px;color:var(--ink2)}
.tag{font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:8px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}.tag.lo{border-color:var(--red);color:var(--red2)}
.meter{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ink)}
.cta{background:var(--ink);color:#fff;border-radius:12px;padding:20px;margin-top:24px}.cta b.h{font-size:19px;display:block;margin-bottom:4px}.cta p{color:#dfe1e6;margin:6px 0 14px}.cta .btn.ghost{color:#fff;border-color:#fff;margin-left:8px}.cta .btn.ghost:hover{background:#fff;color:var(--ink)}
.more{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:15px}.more a,.more button{color:var(--muted)}
.hub{display:grid;gap:12px;margin-top:18px}
.hub a{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink);transition:border-color .12s}
.hub a:hover{border-color:var(--ink)}.hub b{font-size:19px;line-height:1.25}.hub span{color:var(--muted);font-size:15px;grid-column:1}.hub em{grid-row:1/3;grid-column:2;font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap}
footer{max-width:720px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
@media (max-width:520px){h1{font-size:27px}h2{font-size:21px}.card{padding:22px 18px}.big b{font-size:44px}.two{grid-template-columns:1fr}.ring{width:76px;height:76px}.ring i{width:54px;height:54px}.cta .btn.ghost{margin:10px 0 0}}
</style>
</head>

<header><div class="bar"><a class="brand" id="home" href="?">Brixen <b>Consultancy</b></a><a class="all" id="all" href="?">All tools</a></div></header>

<script>
// ---------------- settings ----------------
var CFG = {
  EMAIL: 'info@brixenconsultancy.com',
  PHONE: '+1 (229) 210-3506',
  // Where leads are sent: a GoHighLevel inbound webhook, or any URL that accepts a JSON POST.
  // EMPTY = no form is shown and every visitor sees the full result (nothing is collected).
  // Paste the webhook URL here to switch the lead form on.
  FORM_ENDPOINT: ''
};
// ---------------- helpers ----------------
var Q = new URLSearchParams(location.search), APP = document.getElementById('app');
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var m = function (n) { return (n < 0 ? '-' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US'); };
var nf = function (n) { return Math.round(n).toLocaleString('en-US'); };
var store = { get: function () { try { return JSON.parse(localStorage.getItem('bx_lm') || 'null'); } catch (e) { return null; } }, set: function (v) { try { localStorage.setItem('bx_lm', JSON.stringify(v)); } catch (e) {} } };
var who = { n: (Q.get('n') || '').trim(), c: (Q.get('c') || '').trim() };
var keep = function (t) { var p = new URLSearchParams(); if (t) p.set('t', t); ['n', 'c', 'src', 'sal'].forEach(function (k) { if (Q.get(k)) p.set(k, Q.get(k)); }); var s = p.toString(); return s ? '?' + s : '?'; };
var area = function (a, ids) { return ids.reduce(function (s, k) { return s + (a[k] || 0); }, 0); };
var plain = function (h) { var d = document.createElement('div'); d.innerHTML = h; return d.textContent; };

// ---------------- the tools ----------------
var TOOLS = {
  score: {
    kick: 'For firm owners · 12 questions · 3 minutes', mins: '3 min',
    title: 'Could your firm run for two weeks without you?',
    sub: 'Twelve quick questions about your time, profit, capacity and slow months.',
    get: ['A score out of 100 for how much the firm depends on you', 'Which of four areas is costing you most', 'The first change to make there'],
    hub: 'A score out of 100, and the one area that costs you most.',
    steps: [
      { id: 't1', q: 'When did you last take a full week off with no laptop?', opts: [['In the last 12 months', 2], ['One to three years ago', 1], ['I can\'t remember', 0]] },
      { id: 't2', q: 'How many hours a week do you personally draw, model or fix drawings?', opts: [['Under 3', 2], ['3 to 10', 1], ['More than 10', 0]] },
      { id: 't3', q: 'If you were away for two weeks, the drawings would…', opts: [['Keep going out the door', 2], ['Slow down', 1], ['Stop', 0]] },
      { id: 'p1', q: 'Do you know last year\'s profit as a share of your fees, without looking it up?', opts: [['Yes, within a point or two', 2], ['Roughly', 1], ['No', 0]] },
      { id: 'p2', q: 'On your last three projects, how did the hours compare with what the fee allowed?', opts: [['At or under on all three', 2], ['Over on one or two', 1], ['Over on all, or we don\'t track it', 0]] },
      { id: 'p3', q: 'A client changes the design after sign-off. What happens?', opts: [['We price it before we draw it', 2], ['We bill it sometimes', 1], ['We usually just absorb it', 0]] },
      { id: 'c1', q: 'In the last six months, have you turned down or delayed a project because the team was full?', opts: [['No', 2], ['Once', 1], ['More than once', 0]] },
      { id: 'c2', q: 'Do you have an open drawing or design seat right now?', opts: [['No', 2], ['Yes, open under two months', 1], ['Yes, open longer than that', 0]] },
      { id: 'c3', q: 'A rush job lands on Monday. What do you do?', opts: [['Add capacity this week', 2], ['Shuffle people and push other jobs', 1], ['Do it myself at night', 0]] },
      { id: 's1', q: 'If fees dropped 30% for three months, you would…', opts: [['Ride it out from reserves', 2], ['Cut hours or delay my own pay', 1], ['Have to let someone go', 0]] },
      { id: 's2', q: 'How much of your monthly cost is fixed whatever the workload (salaries, rent, software)?', opts: [['Under 70%', 2], ['70 to 90%', 1], ['Over 90%, or I don\'t know', 0]] },
      { id: 's3', q: 'In the last two years, have you skipped your own pay to cover payroll?', opts: [['No', 2], ['Once or twice', 1], ['More than that', 0]] }
    ],
    result: function (a) {
      var A = [['Your time', area(a, ['t1', 't2', 't3']), 'You are still the production line. List the hours you draw or fix drawings each week, then move the first five of them to someone else, inside or outside the firm. Your review stays. Your drafting goes.'],
        ['Profit', area(a, ['p1', 'p2', 'p3']), 'Money is leaving between the fee and the timesheet. Pick one finished job, count every hour including your own, and divide the fee by it. Then price the next change before it is drawn.'],
        ['Capacity', area(a, ['c1', 'c2', 'c3']), 'Work is arriving faster than you can draw it, and a full team or an open seat is costing you projects. Before you hire, set up drawing capacity you can switch on for one project and off again.'],
        ['Slow months', area(a, ['s1', 's2', 's3']), 'Almost all of your cost is fixed, so a slow quarter lands on your own pay. Each cost you turn from a salary into a per-project cost buys you months of safety.']];
      var tot = A.reduce(function (s, x) { return s + x[1]; }, 0), sc = Math.round(tot / 24 * 100), low = A.slice().sort(function (x, y) { return x[1] - y[1]; })[0];
      var band = sc >= 80 ? 'The firm runs as a business. It does not need you at a screen.' : sc >= 55 ? 'The firm works, but it leans on you in at least one place.' : 'Right now the firm is you. If you stop, it stops.';
      return { big: sc, unit: 'out of 100', ring: sc, line: band + (low[1] < 5 ? ' Your weakest area is <b>' + low[0].toLowerCase() + '</b> (' + low[1] + ' of 6).' : ''),
        tease: ['Your score in each of the four areas', 'The first change to make in your weakest area', 'What to leave alone'],
        rows: A.map(function (x) { return { h: x[0], v: x[1] + ' / 6', pct: x[1] / 6 * 100, p: x[1] >= 5 ? 'Strong. Leave it alone and spend your effort elsewhere.' : x[2] }; }) };
    }
  },
  pay: {
    kick: 'For firm owners · 6 numbers · 2 minutes', mins: '2 min',
    title: 'Do you earn more per hour than your best-paid employee?',
    sub: 'You carry the risk, the payroll and the late nights. See what an hour of your time actually pays, next to theirs.',
    get: ['Your real pay per hour worked', 'How it compares with your best-paid employee', 'What it becomes if you stop drawing'],
    hub: 'Your real hourly pay as the owner, next to theirs.',
    steps: [
      { id: 'take', q: 'What did you take home from the firm last year?', hint: 'Salary plus any profit you took out, before tax.', pre: '$', def: 140000 },
      { id: 'hrs', q: 'How many hours do you work in a normal week?', hint: 'Count the evenings and weekends.', suf: 'hours', def: 55, max: 120 },
      { id: 'off', q: 'How many weeks did you really take off last year?', suf: 'weeks', def: 2, max: 51 },
      { id: 'draw', q: 'Of your weekly hours, how many go to drawing, modeling or fixing drawings?', suf: 'hours', def: 12, max: 120 },
      { id: 'emp', q: 'What do you pay your best-paid employee per year?', pre: '$', def: 95000 },
      { id: 'ehrs', q: 'How many hours a week do they work?', suf: 'hours', def: 42, max: 120 }
    ],
    result: function (a) {
      var wk = Math.max(1, 52 - a.off), draw = Math.min(a.draw, a.hrs - 1), mine = a.take / (a.hrs * wk || 1), theirs = a.emp / (a.ehrs * 49 || 1), noDraw = a.take / (Math.max(1, a.hrs - draw) * wk), at45 = a.take / (45 * wk);
      var line = mine < theirs ? 'You earn <b>' + m(mine) + ' an hour</b>. Your best-paid employee earns <b>' + m(theirs) + '</b>. You own the firm and carry the risk for <b>' + m(theirs - mine) + ' an hour less</b> than they do.'
        : 'You earn <b>' + m(mine) + ' an hour</b> against <b>' + m(theirs) + '</b> for your best-paid employee. That is <b>' + (mine / theirs).toFixed(2) + ' times</b> their rate for carrying all of the risk.';
      return { big: m(mine), unit: 'your pay per hour worked', line: line,
        bars: [{ l: 'You', v: mine, t: m(mine) + ' / hr', hi: 1 }, { l: 'Your best-paid employee', v: theirs, t: m(theirs) + ' / hr' }, { l: 'You, if you stopped drawing', v: noDraw, t: m(noDraw) + ' / hr' }],
        tease: ['Your hourly pay on a 45-hour week', 'How many working weeks a year you spend at a drafter\'s job', 'What your extra hours are worth'],
        rows: [{ h: 'Your hours last year', v: nf(a.hrs * wk), p: 'That is ' + a.hrs + ' hours a week for ' + wk + ' weeks. Your employee\'s year is about ' + nf(a.ehrs * 49) + ' hours.' },
          { h: 'If you stopped drawing', v: m(noDraw) + ' / hr', p: 'The same take-home on ' + Math.max(1, a.hrs - draw) + ' hours a week. Today you spend about ' + (draw * wk / 40).toFixed(1) + ' full working weeks a year on work a drafter could do.' },
          { h: 'On a 45-hour week', v: m(at45) + ' / hr', p: 'What your hour is worth if the firm earned the same and you worked a normal week.' }].concat(a.hrs > 45 ? [{ h: 'Hours above 45 a week', v: m((a.hrs - 45) * wk * mine), p: 'What those hours are worth at your current rate. The firm gets them from you for nothing.' }] : []) };
    }
  },
  lean: {
    kick: 'For firm owners · 6 numbers · 2 minutes', mins: '2 min',
    title: 'How many slow months can your firm take before you cut your own pay?',
    sub: 'Every owner has a number. Most find it out in the slow quarter. See yours now, and what would stretch it.',
    get: ['Months of cash in a slow patch', 'How long you last if you stop paying yourself', 'What happens if part of payroll moved with the workload'],
    hub: 'Months of runway in a slow patch, and what adds to them.',
    steps: [
      { id: 'pay', q: 'What is your monthly payroll, not counting your own pay?', hint: 'Salaries, payroll taxes and benefits.', pre: '$', def: 32000 },
      { id: 'fix', q: 'What are your other fixed monthly costs?', hint: 'Rent, software, insurance, loan payments.', pre: '$', def: 9000 },
      { id: 'own', q: 'What do you pay yourself each month?', pre: '$', def: 11000 },
      { id: 'fees', q: 'What does the firm bill in a normal month?', hint: 'Your own fees, after consultants.', pre: '$', def: 60000 },
      { id: 'cash', q: 'How much cash could the firm use if it had to?', hint: 'Bank balance, plus any credit line you would really draw on.', pre: '$', def: 45000 },
      { id: 'drop', q: 'How bad a slow patch do you want to test?', opts: [['Fees down 20%', 20], ['Fees down 30%', 30], ['Fees down 50%', 50]] }
    ],
    result: function (a) {
      var inc = a.fees * (1 - a.drop / 100), cost = a.pay + a.fix + a.own, short = cost - inc, mo = short > 0 ? a.cash / short : Infinity, s2 = short - a.own, mo2 = s2 > 0 ? a.cash / s2 : Infinity;
      var f = function (x) { return x === Infinity ? 'No limit' : x.toFixed(1) + ' months'; };
      var vary = function (sh) { var s = short - a.pay * sh * a.drop / 100; return s > 0 ? a.cash / s : Infinity; };
      var cap = function (x) { return x === Infinity ? 1e9 : x; };
      var line = short <= 0 ? 'With fees down ' + a.drop + '%, the firm still covers every cost, your pay included, with <b>' + m(-short) + ' a month</b> to spare. Go back and test a deeper drop to find your edge.'
        : 'With fees down ' + a.drop + '%, the firm is short <b>' + m(short) + ' a month</b>. Your cash lasts <b>' + f(mo).toLowerCase() + '</b> before you have to cut your own pay or let someone go.';
      return { big: mo === Infinity ? 'Safe' : mo.toFixed(1), unit: mo === Infinity ? 'at this drop' : 'months before you cut your own pay', line: line,
        bars: short > 0 ? [{ l: 'As you are today', v: cap(mo), t: f(mo), hi: 1 }, { l: 'If 20% of payroll moved with workload', v: cap(vary(.2)), t: f(vary(.2)) }, { l: 'If 40% of payroll moved with workload', v: cap(vary(.4)), t: f(vary(.4)) }] : null,
        tease: ['How long you last if you stop paying yourself', 'What "payroll that moves with workload" means in practice', 'The one cost that buys the most months'],
        rows: [{ h: 'If you stop paying yourself', v: f(mo2), p: 'The usual first move in a small firm. It buys time, and it costs you personally ' + m(a.own) + ' a month.' },
          { h: 'If 20% of payroll moved with workload', v: f(vary(.2)), p: 'For example, one drawing seat paid per project. When work drops ' + a.drop + '%, that cost drops with it.' },
          { h: 'If 40% of payroll moved with workload', v: f(vary(.4)), p: 'A small core team, plus outside drawing capacity for the peaks.' },
          { h: 'Fixed cost today', v: Math.round(100 * cost / (a.fees || 1)) + '% of normal fees', p: 'Payroll is ' + m(a.pay) + ' of your ' + m(cost) + ' monthly cost. It is the only line big enough to change the answer.' }] };
    }
  },
  profit: {
    kick: 'For firm owners · 5 numbers · 3 minutes', mins: '3 min',
    title: 'Is your firm actually making money?',
    sub: 'Most owners know their revenue. Few know the five numbers that decide what is left of it. You need last year\'s totals from your books.',
    get: ['What you keep from every dollar of your own fees', 'Your five key numbers next to the industry benchmarks', 'Which one is leaking, and what it is worth'],
    hub: 'Your five key numbers next to the industry benchmarks.',
    steps: [
      { id: 'rev', q: 'How much did the firm bill clients in the last 12 months?', pre: '$', def: 900000 },
      { id: 'cons', q: 'How much of that was paid on to consultants and reimbursables?', pre: '$', def: 150000 },
      { id: 'pay', q: 'What was total payroll, everyone included, you too?', pre: '$', def: 420000 },
      { id: 'oh', q: 'What were all your other costs?', hint: 'Rent, software, insurance, benefits, payroll taxes, marketing.', pre: '$', def: 230000 },
      { id: 'ut', q: 'Of all the hours you paid for, what share was billed to projects?', hint: 'Count everyone, including you and admin. A rough figure is fine.', suf: '%', def: 55, max: 100 }
    ],
    result: function (a) {
      var nr = a.rev - a.cons, u = a.ut / 100, dl = a.pay * u, ohT = a.pay * (1 - u) + a.oh, ohr = dl ? ohT / dl : 0, be = 1 + ohr, nm = dl ? nr / dl : 0, pm = a.pay ? nr / a.pay : 0, pr = nr - a.pay - a.oh, pt = a.pay * .01 * nm;
      var line = be >= nm ? 'Each $1 of project salary has to bring in <b>$' + be.toFixed(2) + '</b> before you profit, and it brings in <b>$' + nm.toFixed(2) + '</b>. The firm is working below break-even.'
        : u < .6 ? '<b>' + Math.round((1 - u) * 100) + '% of the hours you pay for never reach an invoice.</b> At your multiplier, each point of utilization is worth about <b>' + m(pt) + ' a year</b>. Reaching 60% would add about <b>' + m(pt * (60 - a.ut)) + '</b> with no new clients.'
        : nm < 3 ? 'Your people are busy, but each $1 of project salary earns <b>$' + nm.toFixed(2) + '</b> against a benchmark of $3.00. The gap is in fees or in hours written off, not in workload.'

      var R = function (h, v, bm, ok, p) { return { h: h + '<span class="tag' + (ok ? '' : ' lo') + '">' + (ok ? 'on target' : 'off target') + '</span>', v: v, p: 'Benchmark: ' + bm + '. ' + p }; };

  rate: {
